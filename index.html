<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c15">
  <title>PS5 Widget Store</title>
  <style>
    :root{color-scheme:dark;--bg:#080c15;--panel:#101827;--panel2:#151f30;--line:#26354b;--text:#f4f7ff;--muted:#9aabc3;--cyan:#70e6ff;--green:#7cf3bf;--gold:#ffd479}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 18% -10%,#153453 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    .wrap{max-width:1180px;margin:auto;padding:34px 30px 55px}.brand{display:flex;gap:18px;align-items:center;margin-bottom:30px}.mark{width:64px;height:64px;border:1px solid #43839a;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#123344,#101827);color:var(--cyan);font-size:34px;box-shadow:0 12px 38px #0008}.brand h1{font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0;letter-spacing:-1.2px}.brand p{color:var(--muted);margin:7px 0 0}.topline{height:1px;background:linear-gradient(90deg,var(--cyan),#26354b 70%,transparent);margin-bottom:26px}
    .layout{display:grid;grid-template-columns:minmax(280px,390px) minmax(0,1fr);gap:22px}.list,.detail{border:1px solid var(--line);border-radius:22px;background:#0e1624eF;overflow:hidden}.sectionHead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px}.sectionHead h2{font-size:17px;margin:0}.count,.tag{font-size:12px;border:1px solid #2e5366;border-radius:99px;color:var(--cyan);padding:4px 10px;white-space:nowrap}.cards{padding:0 12px 14px}.card{width:100%;text-align:left;color:inherit;border:1px solid transparent;background:transparent;border-radius:16px;padding:13px;display:flex;gap:14px;align-items:center;cursor:pointer;font:inherit}.card:hover,.card:focus-visible,.card.active{outline:0;background:var(--panel2);border-color:#38526d}.icon{width:62px;height:62px;flex:0 0 62px;border-radius:16px;background:#1a2638;object-fit:cover;border:1px solid #ffffff18}.fallback{display:grid;place-items:center;font-size:25px;color:var(--cyan)}.cardTitle{font-weight:700;font-size:16px}.cardDesc{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cardMeta{display:flex;gap:7px;align-items:center;margin-top:7px;color:var(--muted);font-size:11px}.detail{min-height:470px;padding:clamp(24px,4vw,42px);position:relative}.detailTop{display:flex;gap:23px;align-items:center}.heroIcon{width:104px;height:104px;border-radius:26px;object-fit:cover;background:#1a2638;border:1px solid #ffffff20}.detail h2{font-size:clamp(26px,3.5vw,38px);margin:12px 0 4px;line-height:1.1}.description{color:#c4d0e2;font-size:17px;max-width:680px}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:19px 0}.meta span{background:#151f30;border:1px solid var(--line);padding:6px 11px;border-radius:99px;color:#c1d0e3;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:99px;padding:0 19px;text-decoration:none;font-weight:750;color:#071218;background:var(--cyan)}.button.secondary{background:#172235;border:1px solid #41536b;color:var(--text)}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.notice{color:var(--muted);font-size:13px;margin-top:20px}.footer{color:#71829b;font-size:12px;text-align:center;padding-top:25px}.hide{display:none!important}
    @media(max-width:780px){.wrap{padding:22px 14px 35px}.layout{grid-template-columns:1fr}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.detail{min-height:390px}.icon{width:54px;height:54px;flex-basis:54px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><div class="mark" aria-hidden="true">▦</div><div><h1>Widget Store</h1><p>Community made tiles for Welcome Hub</p></div></header>
    <div class="topline"></div>
    <div class="layout">
      <section class="list" aria-label="Available widgets"><div class="sectionHead"><h2>Available widgets</h2><span class="count" id="count">Loading</span></div><div class="cards" id="cards"><div class="empty">Loading the catalog…</div></div></section>
      <article class="detail" id="detail"><div class="empty">Choose a widget to see its details.</div></article>
    </div>
    <p class="footer">Catalog powered by the open PS5 Widget Store repository.</p>
  </main>
  <script>
  (function(){
    'use strict';
    var owner='manchildtechnologies-ui',repo='ps5-widget-store',branch='main';
    var catalogUrl='https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/catalog.json';
    var root='https://'+owner+'.github.io/'+repo+'/';
    var cards=document.getElementById('cards'),detail=document.getElementById('detail'),count=document.getElementById('count'),items=[],active='';
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function asset(path){if(!path)return '';if(/^https:\/\//i.test(path))return path;return 'https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+String(path).replace(/^\//,'');}
    function repoFolder(item){var f=(item.files||[]).filter(function(x){return typeof x==='string'&&/(^|\/)config\.json$/i.test(x);})[0]||'';return f.replace(/\/[^/]+$/,'');}
    function githubUrl(item){return 'https://github.com/'+owner+'/'+repo+'/tree/'+branch+'/'+repoFolder(item);}
    function renderList(){
      count.textContent=items.length+' '+(items.length===1?'widget':'widgets');
      if(!items.length){cards.innerHTML='<div class="empty">No widgets are listed yet.</div>';return;}
      cards.innerHTML=items.map(function(x){var img=asset(x.icon),icon=img?'<img class="icon" src="'+esc(img)+'" alt="">':'<span class="icon fallback">'+esc(x.glyph||'▦')+'</span>';return '<button class="card '+(x.id===active?'active':'')+'" data-id="'+esc(x.id)+'">'+icon+'<span><span class="cardTitle">'+esc(x.title)+'</span><span class="cardDesc">'+esc(x.description||'')+'</span><span class="cardMeta"><span>'+esc(x.category||'Widget')+'</span><span>·</span><span>v'+esc(x.version||'?')+'</span></span></span></button>';}).join('');
      Array.prototype.forEach.call(cards.querySelectorAll('[data-id]'),function(b){b.onclick=function(){show(b.getAttribute('data-id'),true);};});
    }
    function show(id,push){var x=items.filter(function(it){return it.id===id;})[0];if(!x)return;active=id;renderList();if(push){var u=new URL(location.href);u.searchParams.set('widget',id);history.replaceState(null,'',u.toString());}
      var screenshots=Array.isArray(x.screenshots)?x.screenshots:[];var shots=screenshots.map(function(s){var url=typeof s==='string'?s:s&&s.url;var label=typeof s==='object'&&s.label?s.label:x.title+' screenshot';return url?'<img loading="lazy" src="'+esc(asset(url))+'" alt="'+esc(label)+'">':'';}).join('');
      var hero=x.icon?'<img class="heroIcon" src="'+esc(asset(x.icon))+'" alt="">':'<span class="heroIcon fallback">'+esc(x.glyph||'▦')+'</span>';detail.innerHTML='<div class="detailTop">'+hero+'<div><span class="tag">'+esc(x.category||'Widget')+'</span><div class="meta"><span>Version '+esc(x.version||'Unknown')+'</span><span>'+((x.files||[]).length)+' install files</span></div></div></div><h2>'+esc(x.title)+'</h2><p class="description">'+esc(x.description||'No description provided.')+'</p><div class="actions"><a class="button" href="'+esc(githubUrl(x))+'">View package on GitHub</a><a class="button secondary" href="'+esc(githubUrl(x))+'">Package files</a></div>'+(shots?'<h3>Screenshots</h3><div class="shots">'+shots+'</div>':'<p class="notice">Screenshots will appear here when the widget author adds them to the catalog.</p>')+'<p class="notice">Install from the Widget Store tile on your PS5. This page is a catalog preview; installation happens in Welcome Hub.</p>';
    }
    fetch(catalogUrl,{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('Catalog request failed ('+r.status+').');return r.json();}).then(function(data){items=Array.isArray(data.widgets)?data.widgets:[];renderList();var wanted=new URLSearchParams(location.search).get('widget');if(wanted&&items.some(function(x){return x.id===wanted;}))show(wanted,false);else if(items.length)show(items[0].id,false);}).catch(function(e){count.textContent='Unavailable';cards.innerHTML='<div class="empty">Could not load the widget catalog.<br>'+esc(e.message||e)+'</div>';});
  })();
  </script>
</body>
</html>
